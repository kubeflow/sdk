name: Trigger distributed-workloads E2E

on:
  workflow_call:
    inputs:
      sdk_ref:
        description: 'SDK branch/ref to test'
        required: true
        type: string
      sdk_version:
        description: 'SDK version being tested'
        required: false
        type: string
    secrets:
      dispatch_token:
        required: true

jobs:
  trigger-and-wait:
    name: Trigger and wait for E2E tests
    runs-on: ubuntu-latest
    steps:
      - name: Trigger distributed-workloads E2E
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.dispatch_token }}
          repository: project-codeflare/kubeflow-devx-post-merge-tests
          event-type: run-sdk-dw-e2e-tests
          client-payload: '{
            "sdk_repo": "${{ github.repository }}",
            "sdk_ref": "${{ inputs.sdk_ref }}",
            "sdk_sha": "${{ github.sha }}",
            "sdk_version": "${{ inputs.sdk_version }}"
          }'

      - name: Poll for E2E workflow completion
        env:
          GH_TOKEN: ${{ secrets.dispatch_token }}
          ORG: project-codeflare
          REPO: kubeflow-devx-post-merge-tests
        run: |
          sleep 30
          echo "Polling $ORG/$REPO for distributed-workloads E2E results..."

          workflow_id=$(gh api repos/$ORG/$REPO/actions/workflows \
            | jq -r '.workflows[] | select(.name=="SDK distributed-workloads E2E Runner") | .id' \
            | head -1)

          if [ -z "$workflow_id" ]; then
            echo "Error: Workflow ID not found. Make sure the workflow name matches exactly." && exit 1
          fi

          echo "Found the workflow ID: $workflow_id"

          # Wait for the workflow run to appear (retry up to 10 times, 5 seconds apart)
          for i in {1..10}; do
            run_id=$(
              gh api repos/$ORG/$REPO/actions/runs \
                | jq -r ".workflow_runs[] | select(.workflow_id==$workflow_id) | .id" \
                | head -1 \
                || true
            )

            echo "Attempt $i: run_id=$run_id"

            if [[ -n "$run_id" && "$run_id" != "null" ]]; then
              break
            fi

            echo "Waiting for run to start..."
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "Error: Workflow run not found" && exit 1
          fi

          echo "Monitoring run ID $run_id..."
          echo "View logs at: https://github.com/$ORG/$REPO/actions/runs/$run_id"

          # Poll for completion (up to 90 times, 30 seconds apart = 45 minutes max)
          for i in {1..90}; do
            status=$(gh api repos/$ORG/$REPO/actions/runs/$run_id --jq '.status')
            conclusion=$(gh api repos/$ORG/$REPO/actions/runs/$run_id --jq '.conclusion')

            echo "Status: $status | Conclusion: $conclusion"

            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" == "success" ]]; then
                echo "Success: distributed-workloads E2E tests completed successfully"
                exit 0
              else
                echo "Error: distributed-workloads E2E tests failed with conclusion: $conclusion"
                echo "View logs at: https://github.com/$ORG/$REPO/actions/runs/$run_id"
                exit 1
              fi
            fi

            sleep 30
          done

          echo "Error: Timeout waiting for distributed-workloads E2E workflow"
          exit 1
