name: Welcome new contributors

on:
  pull_request_target:
    types:
      - opened
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            🎉 **Welcome to the Kubeflow SDK!** 🎉

            Thanks for opening your first issue! We're happy to have you as part of our community 🚀

            **Here's what happens next:**

            - Our team will review your issue soon! cc @kubeflow/kubeflow-sdk-team
            - If you'd like to contribute to this issue, check out our [Contributing Guide](https://github.com/kubeflow/sdk/blob/main/CONTRIBUTING.md) for repo-specific guidelines and the [Kubeflow Contributor Guide](https://www.kubeflow.org/docs/about/contributing/) for general community standards

            **Join the community:**
            - **Slack**: Join our [#kubeflow-ml-experience](https://www.kubeflow.org/docs/about/community/#kubeflow-slack-channels) and [#kubeflow-trainer](https://www.kubeflow.org/docs/about/community/#kubeflow-slack-channels) Slack channels
            - **Meetings**: Attend the [Kubeflow SDK and ML Experience](https://bit.ly/kf-ml-experience) bi-weekly meetings

            Feel free to ask questions in the comments if you need any help or clarification!
            Thanks again for contributing to Kubeflow! 🙏

          pr_message: |
            🎉 **Welcome to the Kubeflow SDK!** 🎉

            Thanks for opening your first PR! We're happy to have you as part of our community 🚀

            **Here's what happens next:**

            - If you haven't already, please check out our [Contributing Guide](https://github.com/kubeflow/sdk/blob/main/CONTRIBUTING.md) for repo-specific guidelines and the [Kubeflow Contributor Guide](https://www.kubeflow.org/docs/about/contributing/) for general community standards
            - Our team will review your PR soon! cc @kubeflow/kubeflow-sdk-team

            **Join the community:**
            - **Slack**: Join our [#kubeflow-ml-experience](https://www.kubeflow.org/docs/about/community/#kubeflow-slack-channels) and [#kubeflow-trainer](https://www.kubeflow.org/docs/about/community/#kubeflow-slack-channels) Slack channels
            - **Meetings**: Attend the [Kubeflow SDK and ML Experience](https://bit.ly/kf-ml-experience) bi-weekly meetings

            Feel free to ask questions in the comments if you need any help or clarification!
            Thanks again for contributing to Kubeflow! 🙏
