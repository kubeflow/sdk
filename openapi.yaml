components:
  securitySchemes:
    KubernetesBearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Kubernetes API authentication via kubeconfig, in-cluster ServiceAccount, or
        `KubernetesBackendConfig` (`config_file`, `context`, `client_configuration`).

    SparkConnectToken:
      type: http
      scheme: bearer
      description: |
        Optional bearer token for Spark Connect (`SparkClient.connect(token=...)`).
        Applied as `spark.connect.authenticate.token` when connecting to an existing server.

    ModelRegistryBearerToken:
      type: http
      scheme: bearer
      description: |
        Model Registry REST authentication via `ModelRegistryClient(user_token=...)`.
        The registry server is external to this repository; see `.agents/api/surfaces.yaml`.

  schemas:
    TrainerTrainRequest:
      type: object
      properties:
        runtime:
          oneOf:
            - type: string
            - $ref: "#/components/schemas/Runtime"
          description: Runtime name or object; K8s default is torch-distributed when omitted
        initializer:
          $ref: "#/components/schemas/InitializerRef"
        trainer:
          oneOf:
            - $ref: "#/components/schemas/CustomTrainer"
            - $ref: "#/components/schemas/CustomTrainerContainer"
            - $ref: "#/components/schemas/BuiltinTrainerRef"
          description: |
            Trainer configuration. Use CustomTrainer for user-defined functions,
            CustomTrainerContainer for custom images, BuiltinTrainer for predefined trainers.
        options:
          type: array
          description: Callable options from kubeflow.trainer.options
          items:
            type: object
            additionalProperties: true

    CustomTrainer:
      type: object
      description: Self-contained training function configuration
      required: [func]
      properties:
        func:
          type: object
          description: Python callable (not JSON-serializable; reference only)
        func_args:
          type: object
          additionalProperties: true
        image:
          type: string
        packages_to_install:
          type: array
          items:
            type: string
        pip_index_urls:
          type: array
          items:
            type: string
        num_nodes:
          type: integer
          minimum: 1
        resources_per_node:
          type: object
          additionalProperties:
            type: string
          example:
            cpu: "2"
            memory: 4Gi
        env:
          type: object
          additionalProperties:
            type: string

    CustomTrainerContainer:
      type: object
      required: [image]
      properties:
        image:
          type: string
        num_nodes:
          type: integer
          minimum: 1
        resources_per_node:
          type: object
          additionalProperties:
            type: string
        env:
          type: object
          additionalProperties:
            type: string

    BuiltinTrainerRef:
      type: object
      description: Builtin trainer parameters; see kubeflow.trainer.types.types.BuiltinTrainer
      required: [trainer_type]
      properties:
        trainer_type:
          type: string
          example: BuiltinTrainer

    InitializerRef:
      type: object
      description: Dataset/model initializer; see kubeflow.trainer.types.types.Initializer hierarchy

    Runtime:
      type: object
      required: [name, trainer]
      properties:
        name:
          type: string
        trainer:
          type: object
          description: RuntimeTrainer configuration
        pretrained_model:
          type: string
          nullable: true

    TrainJob:
      type: object
      required: [name, runtime, steps, num_nodes, creation_timestamp]
      properties:
        name:
          type: string
        runtime:
          $ref: "#/components/schemas/Runtime"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/TrainJobStep"
        num_nodes:
          type: integer
        creation_timestamp:
          type: string
          format: date-time
        status:
          type: string
          enum: [Created, Running, Complete, Failed, Unknown]

    TrainJobStep:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          nullable: true
        pod_name:
          type: string
        device:
          type: string
        device_count:
          type: string

    SparkConnectRequest:
      type: object
      properties:
        base_url:
          type: string
          description: Spark Connect URL (connect mode), e.g. sc://server:15002
          example: sc://spark-connect-server:15002
        token:
          type: string
          description: Optional authentication token (connect mode)
        num_executors:
          type: integer
          minimum: 1
          description: Create mode only
        resources_per_executor:
          type: object
          additionalProperties:
            type: string
          example:
            cpu: "2"
            memory: 4Gi
        spark_conf:
          type: object
          additionalProperties:
            type: string
        driver:
          $ref: "#/components/schemas/Driver"
        executor:
          $ref: "#/components/schemas/Executor"
        options:
          type: array
          items:
            type: object
            additionalProperties: true
        timeout:
          type: integer
          default: 300
        connect_timeout:
          type: integer
          default: 120

    Driver:
      type: object
      properties:
        image:
          type: string
        resources:
          type: object
          additionalProperties:
            type: string
        java_options:
          type: string
        service_account:
          type: string

    Executor:
      type: object
      properties:
        num_instances:
          type: integer
          minimum: 1
        resources_per_executor:
          type: object
          additionalProperties:
            type: string
        image:
          type: string

    SparkConnectInfo:
      type: object
      required: [name, namespace, state]
      properties:
        name:
          type: string
        namespace:
          type: string
        state:
          type: string
          enum: [Provisioning, Ready, Running, NotReady, Failed]
        pod_name:
          type: string
          nullable: true
        pod_ip:
          type: string
          nullable: true
        service_name:
          type: string
          nullable: true
        creation_timestamp:
          type: string
          format: date-time
          nullable: true

    SparkSessionRef:
      type: object
      description: Logical reference to a PySpark SparkSession (not serializable)
      properties:
        connected:
          type: boolean
        mode:
          type: string
          enum: [connect, create]

    EventRef:
      type: object
      description: Event from kubeflow.trainer.types.types.Event

    OptimizationJobRef:
      type: object
      description: OptimizationJob from kubeflow.optimizer.types.optimization_types

    OptimizationResultRef:
      type: object
      description: Result from kubeflow.optimizer.types.optimization_types; nullable when no best trial

    OptimizerOptimizeRequest:
      type: object
      required: [trial_template, search_space]
      properties:
        trial_template:
          type: object
          description: TrainJobTemplate from kubeflow.trainer.types.types
        trial_config:
          type: object
          description: Optional TrialConfig
        search_space:
          type: object
          additionalProperties: true
          description: Parameter name to Search spec
        objectives:
          type: array
          items:
            type: object
        algorithm:
          type: object
          description: BaseAlgorithm subclass

    RegisteredModelRef:
      type: object
      description: model_registry.types.RegisteredModel

    ModelVersionRef:
      type: object
      description: model_registry.types.ModelVersion

    ModelArtifactRef:
      type: object
      description: model_registry.types.ModelArtifact

    HubRegisterModelRequest:
      type: object
      required: [name, uri, version]
      properties:
        name:
          type: string
        uri:
          type: string
        version:
          type: string
        model_format_name:
          type: string
        model_format_version:
          type: string
        author:
          type: string
        owner:
          type: string
        version_description:
          type: string
        metadata:
          type: object
          additionalProperties: true
        storage_config:
          type: object
          description: kubeflow.hub.types.types.StorageConfig

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

  responses:
    ValidationError:
      description: Invalid arguments (Python ValueError)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Invalid backend config or trainer type for selected backend
    KubernetesAuthError:
      description: Kubernetes authentication or authorization failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Unable to authenticate with Kubernetes API
    RuntimeError:
      description: Backend operation failed (Python RuntimeError or TimeoutError)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Failed to create TrainJob
