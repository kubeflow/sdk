openapi: 3.1.0
info:
  title: Kubeflow SDK Public API
  version: "0.4.1"
  description: |
    Machine-readable catalog of the Kubeflow Python SDK public surface.

    **This repository does not implement a REST server.** Paths name SDK client
    operations (`ClientClass.method`), not HTTP URLs. Agents should diff requirements
    against these operation definitions and linked schemas.

    - Surface index: `.agents/api/surfaces.yaml`
    - Vendored CRD YAML: `hack/crds/` (SparkConnect only; other CRDs upstream in surfaces.yaml)
    - Human API docs: `docs/source/` (Sphinx)
    - Scope: all public TrainerClient, SparkClient, OptimizerClient, and ModelRegistryClient methods
    - Rich examples: `train`, `list_jobs`, `connect`, `list_sessions` only; other operations are stubs
  contact:
    name: Kubeflow Authors
    url: https://github.com/kubeflow/sdk
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

externalDocs:
  description: Kubeflow SDK documentation
  url: https://www.kubeflow.org/docs/components

tags:
  - name: trainer
    description: TrainerClient — training job lifecycle
  - name: spark
    description: SparkClient — SparkConnect sessions on Kubernetes
  - name: optimizer
    description: OptimizerClient — Katib hyperparameter search
  - name: hub
    description: ModelRegistryClient — external model registry REST proxy

paths:
  /trainer/TrainerClient/train:
    post:
      tags: [trainer]
      operationId: trainer_train
      summary: Create a TrainJob
      description: |
        Python: `TrainerClient.train(runtime=..., initializer=..., trainer=..., options=...)`

        Kubernetes backend creates a `trainer.kubeflow.org/v1alpha1` TrainJob custom resource.
        Returns the generated job name.
      x-kubeflow-surface: python-sdk
      x-kubeflow-module: kubeflow.trainer.api.trainer_client
      x-kubeflow-crd:
        group: trainer.kubeflow.org
        version: v1alpha1
        kind: TrainJob
      security:
        - KubernetesBearerToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainerTrainRequest"
            examples:
              customTrainerMinimal:
                summary: Single-node CustomTrainer on Kubernetes
                value:
                  trainer:
                    func: {}
                    num_nodes: 1
                    resources_per_node:
                      cpu: "1"
                      memory: 2Gi
                  options:
                    - type: Name
                      value: my-training-job
      responses:
        "200":
          description: Generated TrainJob name
          content:
            application/json:
              schema:
                type: string
              examples:
                jobCreated:
                  value: a1b2c3d4-my-training-job
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/KubernetesAuthError"
        "500":
          $ref: "#/components/responses/RuntimeError"
      x-kubeflow-python-example: |
        from kubeflow.trainer import CustomTrainer, KubernetesBackendConfig, TrainerClient

        def train_fn():
            print("training")

        client = TrainerClient(backend_config=KubernetesBackendConfig(namespace="default"))
        job_name = client.train(
            trainer=CustomTrainer(
                func=train_fn,
                num_nodes=1,
                resources_per_node={"cpu": "1", "memory": "2Gi"},
            ),
        )

  /trainer/TrainerClient/list_jobs:
    get:
      tags: [trainer]
      operationId: trainer_list_jobs
      summary: List TrainJobs
      description: |
        Python: `TrainerClient.list_jobs(runtime=None)`

        Returns TrainJobs in the configured namespace. When `runtime` is set, filters to jobs
        for that runtime.
      x-kubeflow-surface: python-sdk
      x-kubeflow-module: kubeflow.trainer.api.trainer_client
      security:
        - KubernetesBearerToken: []
      parameters:
        - name: runtime
          in: query
          required: false
          description: Optional runtime name or Runtime object filter
          schema:
            oneOf:
              - type: string
              - $ref: "#/components/schemas/Runtime"
      responses:
        "200":
          description: List of TrainJobs (empty list if none exist)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainJob"
              examples:
                jobsListed:
                  value:
                    - name: a1b2c3d4-my-training-job
                      runtime:
                        name: torch-distributed
                        trainer:
                          type: CUSTOM_TRAINER
                      steps: []
                      num_nodes: 1
                      creation_timestamp: "2026-07-03T10:00:00Z"
                      status: Running
        "401":
          $ref: "#/components/responses/KubernetesAuthError"
        "500":
          $ref: "#/components/responses/RuntimeError"
      x-kubeflow-python-example: |
        from kubeflow.trainer import KubernetesBackendConfig, TrainerClient

        client = TrainerClient(backend_config=KubernetesBackendConfig(namespace="default"))
        jobs = client.list_jobs()

