  /spark/SparkClient/connect:
    post:
      tags: [spark]
      operationId: spark_connect
      summary: Connect to or create a SparkConnect session
      description: |
        Python: `SparkClient.connect(base_url=..., token=..., ...)`

        **Connect mode** (`base_url` set): attach to an existing Spark Connect server.
        **Create mode** (no `base_url`): create a `sparkoperator.k8s.io/v1alpha1` SparkConnect CR
        and return a `SparkSession`.
      x-kubeflow-surface: python-sdk
      x-kubeflow-module: kubeflow.spark.api.spark_client
      x-kubeflow-crd:
        group: sparkoperator.k8s.io
        version: v1alpha1
        kind: SparkConnect
      security:
        - KubernetesBearerToken: []
        - SparkConnectToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SparkConnectRequest"
            examples:
              connectExisting:
                summary: Connect to existing Spark Connect server
                value:
                  base_url: sc://spark-connect-server:15002
                  token: optional-bearer-token
              createSession:
                summary: Create new SparkConnect session on Kubernetes
                value:
                  num_executors: 2
                  resources_per_executor:
                    cpu: "2"
                    memory: 4Gi
                  spark_conf:
                    spark.sql.adaptive.enabled: "true"
      responses:
        "200":
          description: Connected SparkSession (logical; PySpark object in Python)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SparkSessionRef"
              examples:
                sessionReady:
                  value:
                    connected: true
                    mode: create
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/KubernetesAuthError"
        "500":
          $ref: "#/components/responses/RuntimeError"
      x-kubeflow-python-example: |
        from kubeflow.spark import KubernetesBackendConfig, SparkClient

        client = SparkClient(backend_config=KubernetesBackendConfig(namespace="spark"))
        spark = client.connect(
            num_executors=2,
            resources_per_executor={"cpu": "2", "memory": "4Gi"},
        )

